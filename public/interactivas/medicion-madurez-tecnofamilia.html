<style>
:root{
  --navy:#27395F; --sky:#3CAEE4; --sun:#FDBF2E; --tomato:#EE4936; --leaf:#1F9D6B;
  --bg:#F2F6FA; --surface:#FFFFFF; --surface-2:#F7FAFC; --ink:#1D2A45; --ink-soft:#55627A; --line:#DCE4EE; --track:#E7EDF4;
  --primary:#27395F; --on-primary:#FFFFFF; --focus:#1F8FCB;
  --c-limites:#EE4936; --c-conversar:#3CAEE4; --c-configurar:#27395F; --c-acompanar:#FDBF2E; --c-acordar:#1F9D6B;
  --t-limites:#FDEEEC; --t-conversar:#E8F5FC; --t-configurar:#EAEEF5; --t-acompanar:#FFF6DB; --t-acordar:#E5F5EE;
  --on-limites:#FFFFFF; --on-conversar:#13203A; --on-configurar:#FFFFFF; --on-acompanar:#13203A; --on-acordar:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1729; --surface:#162239; --surface-2:#1B2A45; --ink:#EDF2F9; --ink-soft:#A9B5C9; --line:#2B3B59; --track:#24334F;
    --primary:#FDBF2E; --on-primary:#16213A; --focus:#7CCBF0;
    --c-limites:#F2705F; --c-conversar:#5BC2EE; --c-configurar:#9FB4E2; --c-acompanar:#FDBF2E; --c-acordar:#3CC48D;
    --t-limites:rgba(242,112,95,.15); --t-conversar:rgba(91,194,238,.14); --t-configurar:rgba(159,180,226,.14); --t-acompanar:rgba(253,191,46,.13); --t-acordar:rgba(60,196,141,.14);
    --on-limites:#13203A; --on-conversar:#13203A; --on-configurar:#13203A; --on-acompanar:#13203A; --on-acordar:#13203A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1729; --surface:#162239; --surface-2:#1B2A45; --ink:#EDF2F9; --ink-soft:#A9B5C9; --line:#2B3B59; --track:#24334F;
  --primary:#FDBF2E; --on-primary:#16213A; --focus:#7CCBF0;
  --c-limites:#F2705F; --c-conversar:#5BC2EE; --c-configurar:#9FB4E2; --c-acompanar:#FDBF2E; --c-acordar:#3CC48D;
  --t-limites:rgba(242,112,95,.15); --t-conversar:rgba(91,194,238,.14); --t-configurar:rgba(159,180,226,.14); --t-acompanar:rgba(253,191,46,.13); --t-acordar:rgba(60,196,141,.14);
  --on-limites:#13203A; --on-conversar:#13203A; --on-configurar:#13203A; --on-acompanar:#13203A; --on-acordar:#13203A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55}
img{max-width:100%}
a{color:inherit;text-decoration-thickness:1.5px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.app{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:52px}
.logo{display:inline-flex;background:#fff;border-radius:14px;padding:6px 10px}
.logo img{display:block;height:38px;width:auto}

.dots{display:flex;gap:7px;list-style:none;margin:0;padding:0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dot.done{background:var(--c);border-color:var(--c)}
.dot.now{border-color:var(--c);outline:2px solid var(--c);outline-offset:2px}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,4.2vw,40px)}

/* Inicio */
.arc{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;list-style:none;margin:6px 0 26px;padding:18px 0 0}
.arc li{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateY(var(--y,0));min-width:0}
.bubble{width:clamp(48px,11vw,64px);height:clamp(48px,11vw,64px);border-radius:50%;display:grid;place-items:center;background:var(--t);border:3px solid var(--c);font-size:clamp(20px,4.6vw,26px);line-height:1}
.arc .lbl{font-size:clamp(.6rem,.46rem + .75vw,.85rem);font-weight:600;color:var(--ink);text-align:center;line-height:1.2}
h1{font-size:clamp(1.65rem,1.2rem + 2.2vw,2.45rem);line-height:1.15;letter-spacing:-.015em;margin:0 0 14px;font-weight:700;text-wrap:balance}
.lead{font-size:1.06rem;color:var(--ink-soft);margin:0 0 20px;max-width:60ch}
.facts{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:8px}
.facts li{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.facts li span{flex:none;width:1.4em;text-align:center}
.tip{background:var(--t-acompanar);border-radius:16px;padding:14px 16px;margin:0 0 24px;font-size:.95rem}

/* Botones */
.btn{font:inherit;font-weight:600;font-size:1rem;border-radius:999px;padding:12px 24px;border:2px solid transparent;cursor:pointer;background:var(--primary);color:var(--on-primary);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn-lg{font-size:1.06rem;padding:14px 28px;width:100%;max-width:340px}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink-soft);filter:none}

/* Pregunta */
.kicker{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:.875rem;color:var(--ink-soft);font-weight:500}
.kicker .pz{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.kicker .pz::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.bar{height:5px;border-radius:5px;background:var(--track);margin:12px 0 22px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .3s ease}
h2.q{font-size:clamp(1.2rem,1.02rem + .9vw,1.55rem);line-height:1.32;font-weight:600;margin:0 0 16px;letter-spacing:-.005em;text-wrap:pretty}
.ayuda{margin:-6px 0 14px;color:var(--ink-soft);font-size:.95rem}
.nota{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin:0 0 18px;font-size:.92rem;color:var(--ink)}
.nota strong{font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background-color .15s;line-height:1.4}
.opt:hover{border-color:var(--ink-soft)}
.mk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:-1px;transition:background-color .15s,border-color .15s}
.opt.multi .mk{border-radius:7px}
.mk svg{width:14px;height:14px;opacity:0;stroke:var(--on-c)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--t)}
.opt[aria-pressed="true"] .mk{background:var(--c);border-color:var(--c)}
.opt[aria-pressed="true"] .mk svg{opacity:1}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.kbd{font-size:.8rem;color:var(--ink-soft);margin-top:14px}

/* Resultado */
.result .eyebrow{font-size:.9rem;font-weight:600;color:var(--ink-soft);margin:0 0 4px;text-align:center}
.verdict{text-align:center}
.verdict h1{margin:4px auto 10px;max-width:22ch}
.verdict .lead{margin:0 auto 14px}
.pill{display:inline-block;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);padding:6px 14px;font-weight:600;font-size:.92rem;margin:0}
.rarc{display:flex;justify-content:space-between;gap:6px;list-style:none;margin:0 0 18px;padding:22px 0 0}
.rarc li{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateY(var(--y,0));min-width:0}
.ringwrap{position:relative;width:clamp(52px,12vw,68px);height:clamp(52px,12vw,68px)}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--track);stroke-width:7}
.ring .fil{fill:none;stroke-width:7;stroke-linecap:round}
.ringwrap .ico{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(18px,4.2vw,24px)}
.rarc .lbl{font-size:clamp(.6rem,.46rem + .75vw,.84rem);font-weight:600;text-align:center;line-height:1.2}
.rarc .lv{font-size:clamp(.58rem,.46rem + .5vw,.74rem);color:var(--ink-soft);text-align:center;line-height:1.15}

.block{margin-top:30px}
.block h2,.box h2{font-size:1.14rem;font-weight:700;margin:0 0 12px;line-height:1.3}
.box{border-radius:20px;padding:18px 20px;margin-top:24px}
.box p{margin:0 0 10px}
.box p:last-child{margin-bottom:0}
.box-edad{background:var(--t-conversar)}
.box-recuerden{background:var(--t-acompanar)}
.fine{font-size:.88rem;color:var(--ink-soft)}

.prio{list-style:none;counter-reset:p;margin:0;padding:0;display:grid;gap:10px}
.prio li{counter-increment:p;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--surface-2);border-radius:16px;padding:12px 14px}
.prio li::before{content:counter(p);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-c);font-weight:700}
.prio small{display:block;color:var(--ink-soft);font-size:.82rem;margin-top:2px}

.rows{display:grid;gap:12px}
.row{border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.row-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row-head .ringwrap{width:42px;height:42px}
.row-head .ringwrap .ico{font-size:17px}
.row-head h3{margin:0;font-size:1.02rem;font-weight:700;flex:1 1 auto}
.lvl{font-size:.8rem;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--t);color:var(--ink)}
.needs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.needs li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:.95rem}
.tag{font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1.5px solid var(--c)}
.tag.afinar{border-style:dashed;color:var(--ink-soft)}
.ok{margin:10px 0 0;font-size:.95rem;color:var(--ink-soft)}
.where{margin:10px 0 0;font-size:.86rem;color:var(--ink-soft)}
.where strong{color:var(--ink);font-weight:600}

.steps{margin:0;padding-left:1.4em;display:grid;gap:8px}
.steps li::marker{font-weight:700;color:var(--ink-soft)}
.pelis{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pelis li{background:var(--surface-2);border-radius:16px;padding:12px 14px;font-size:.92rem}
.pelis strong{display:block;font-size:1rem}
.pelis .yr{font-weight:500;color:var(--ink-soft)}
.adultos{margin-top:12px;font-size:.92rem}

.promo{margin-top:26px;border-radius:20px;padding:18px 20px;background:var(--primary);color:var(--on-primary);display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.promo p{margin:0;font-weight:500;max-width:46ch}
.promo .btn{background:var(--on-primary);color:var(--primary)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.share{margin-top:22px;border:1.5px dashed var(--line);border-radius:18px;padding:14px 16px;font-size:.92rem}
.share label{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.share input{margin-top:5px;width:18px;height:18px;flex:none}
.fuentes{margin-top:26px;font-size:.88rem;color:var(--ink-soft)}
.fuentes summary{cursor:pointer;font-weight:600;color:var(--ink)}
.fuentes ul{margin:10px 0 0;padding-left:1.2em;display:grid;gap:6px}
.pie{margin-top:18px;text-align:center;font-size:.82rem;color:var(--ink-soft)}

.lead-box{margin-top:24px;border:2px solid var(--ink);border-radius:20px;padding:18px 20px}
.lead-box h2{font-size:1.14rem;font-weight:700;margin:0 0 6px;line-height:1.3}
.lead-txt{margin:0 0 14px;color:var(--ink-soft)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.campo label{display:block;font-size:.85rem;font-weight:600;margin:0 0 4px}
.campo input{width:100%;font:inherit;font-size:1rem;padding:10px 14px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin:0 0 10px;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--primary)}
.legal{font-size:.78rem;color:var(--ink-soft);margin:12px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:520px){.campos{grid-template-columns:1fr}}
@media (max-width:420px){
  .app{padding:12px 10px 32px}
  .logo img{height:32px}
  .dot{width:12px;height:12px}
  .arc,.rarc{gap:3px}
  .needs li{grid-template-columns:1fr;gap:4px}
  .tag{justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  body{background:#fff;color:#1D2A45}
  .no-print{display:none!important}
  .app{max-width:none;padding:0}
  .sheet{border:0;padding:0}
  .row,.box,.prio li,.pelis li{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

function estiloPieza(id){

}
function valor(id){

  return (q && i !== undefined) ? q.opciones[i].v : undefined;
}

}
function puntos(){
  var q = PREGUNTAS[st.idx];
  var actual = (st.pantalla==='pregunta' && q && q.pieza) ? PZ[q.pieza].n : 0;
  return '<ol class="dots" aria-label="Piezas del cuestionario">' + PIEZAS.map(function(p){
    var cls = (st.pantalla==='resultado' || p.n < actual) ? 'done' : (p.n===actual ? 'now' : '');
    var est = cls==='done' ? ' (completa)' : (cls==='now' ? ' (en curso)' : '');

}

    var arr = Array.isArray(st.r[q.id]) ? st.r[q.id].slice() : [];
    var k = arr.indexOf(i);
    if (k >= 0) arr.splice(k,1); else arr.push(i);
    st.r[q.id] = arr;
    Array.prototype.forEach.call(botones, function(b){ b.setAttribute('aria-pressed', String(arr.indexOf(+b.getAttribute('data-i')) >= 0)); });
    var s = document.getElementById('seguir'); if (s) s.disabled = arr.length === 0;
    return;
  }
  st.r[q.id] = i;
  Array.prototype.forEach.call(botones, function(b){ b.setAttribute('aria-pressed', String(+b.getAttribute('data-i') === i)); });
  st.lock = true;
  var enIdx = st.idx;
  setTimeout(function(){ st.lock = false; if (st.pantalla === 'pregunta' && st.idx === enIdx) siguiente(); }, 320);
}
function siguiente(){
  var q = PREGUNTAS[st.idx];
  if (q.tipo === 'multiple' && !(st.r[q.id] || []).length) return;
  if (q.tipo === 'unica' && st.r[q.id] === undefined) return;
  if (st.idx < TOTAL-1){ st.idx++; } else { st.pantalla = 'resultado'; }
  render();
}
function atras(){
  if (st.idx === 0) st.pantalla = 'inicio'; else st.idx--;
  render();
}

/* ===================== Resultado ===================== */
function herramientas(){
  var so = valor('so');
  if (so === 'android') return 'Google Family Link';
  if (so === 'iphone') return 'Tiempo en pantalla y Compartir en familia';
  return 'Google Family Link en Android, o Tiempo en pantalla en iPhone';
}
function calcular(){
  var piezas = PIEZAS.map(function(p){
    var qs = PREGUNTAS.filter(function(q){ return q.pieza === p.id && !q.contexto; });
    var s = 0, m = 0, pend = [];
    qs.forEach(function(q){
      var pts = q.opciones[st.r[q.id]].p;
      s += pts; m += 3;
      if (pts <= 2) pend.push({id:q.id, texto:q.meta.replace('{herramientas}', herramientas()), prio:q.prio, nivel:(pts<=1?'construir':'afinar'), pieza:p});
    });
    pend.sort(ordenPend);
    var pct = m ? s/m : 0;
    return {p:p, pct:pct, nivel:(pct>=0.75?'lista':(pct>=0.5?'construccion':'construir')), pend:pend};
  });
  var todas = [];
  piezas.forEach(function(x){ todas = todas.concat(x.pend); });
  todas.sort(ordenPend);
  var L = piezas.filter(function(x){return x.nivel==='lista';}).length;
  var P = piezas.filter(function(x){return x.nivel==='construir';}).length;
  return {piezas:piezas, top:todas.slice(0,3), L:L, P:P};
}
function ordenPend(a,b){
  if (a.nivel !== b.nivel) return a.nivel === 'construir' ? -1 : 1;
  return b.prio - a.prio;
}
function veredicto(L,P){
  var v = veredictoBase(L,P), e = valor('edad');
  if ((e === '8' || e === '9-10') && (L === 5 || (P === 0 && L >= 3))) v.texto += ' Por la edad de su hijo/a, revisen abajo lo que recomiendan los expertos: muchas familias empiezan con un paso intermedio.';
  return v;
}
function veredictoBase(L,P){
  if (L === 5) return {id:'solidas', icono:'🌟', titulo:'Tienen bases sólidas para acompañar este paso', texto:'Lo que sigue es construir con su hijo/a el pacto digital y acompañar de cerca los primeros meses. El momento lo deciden ustedes, según su madurez y las recomendaciones para su edad.'};
  if (P === 0 && L >= 3) return {id:'encaminados', icono:'🧭', titulo:'Van muy bien encaminados', texto:'Tienen buena parte del camino recorrido. Estas son las piezas que conviene afinar antes de dar el paso.'};
  if (P === 0) return {id:'buencamino', icono:'👣', titulo:'Van por buen camino', texto:'Tienen bases en todas las piezas y varias por afinar. Este es su mapa de lo que necesitan para llegar.'};
  if (P <= 2) return {id:'piezasclave', icono:'🧩', titulo:'Hay piezas clave por construir', texto:'Antes del primer celular vale la pena trabajar lo que aparece abajo. No es un “no”: es saber qué les falta para llegar.'};
  return {id:'preparar', icono:'🌱', titulo:'Es momento de preparar el camino', texto:'Estas piezas son la base para que el primer celular llegue en el mejor momento. Empiecen por sus tres prioridades.'};
}
function bloqueEdad(){
  var e = valor('edad'), mot = motivos();
  var base = {
    '8':'Las guías de expertos coinciden en que a esta edad todavía no es momento de un celular propio. La Comisión de expertos sobre pantallas de Francia (2024) recomienda no tenerlo antes de los 11 años.',
    '9-10':'Las guías de expertos recomiendan esperar. La Comisión de expertos sobre pantallas de Francia (2024) sugiere no tener celular propio antes de los 11 años, y Jonathan Haidt (2024) propone que, antes de los 14, sea un teléfono básico, sin internet.',
    '11-12':'Como referencia, la Comisión de expertos sobre pantallas de Francia (2024) sugiere un teléfono sin internet entre los 11 y los 13 años, y desde los 13 un celular con internet pero sin redes sociales. Jonathan Haidt (2024) propone esperar hasta los 14 para el celular inteligente.',
    '13-14':'WhatsApp y la mayoría de redes sociales piden mínimo 13 años en sus condiciones de uso. Como referencia, varias guías recomiendan esperar hasta los 15 o 16 años para las redes sociales (Comisión de expertos sobre pantallas de Francia, 2024; Jonathan Haidt, 2024).',
    '15':'A esta edad el foco está en la autonomía con acuerdos. Como referencia, varias guías sitúan el acceso a redes sociales entre los 15 y los 16 años, con conversación y ejemplo en casa.'
  }[e] || '';
  var menor = (e === '8' || e === '9-10' || e === '11-12');
  var extra = '';
  if (menor && mot.indexOf('comunicar') >= 0) extra += '<p>Si lo principal es estar en contacto, un teléfono básico (solo llamadas y mensajes) o un reloj con llamadas cubren esa necesidad sin abrir todo internet.</p>';
  if (menor && mot.indexOf('redes') >= 0) extra += '<p>Para tener en cuenta: WhatsApp y las redes sociales piden mínimo 13 años en sus condiciones de uso.</p>';
  if (mot.indexOf('amigos') >= 0) extra += '<p>Si la presión viene de los amigos, ayuda conversar con otras familias del curso: cuando varias familias acuerdan esperar, para los niños es más fácil.</p>';
  return '<div class="box box-edad"><h2>Sobre la edad</h2><p>'+base+'</p>'+extra+'<p class="fine">Son referencias, no reglas: ustedes deciden según la madurez de su hijo/a y lo que estén listos para acompañar.</p></div>';
}
function anillo(id, pct, icono){
  var r = 26, c = 2*Math.PI*r, f = Math.max(pct, 0.04)*c;
  return '<span class="ringwrap"><svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="'+r+'" class="trk"/><circle cx="32" cy="32" r="'+r+'" class="fil" style="stroke:var(--c-'+id+');stroke-dasharray:'+f.toFixed(1)+' '+c.toFixed(1)+'"/></svg><span class="ico" aria-hidden="true">'+icono+'</span></span>';
}
var NIVEL = {lista:'Pieza lista', construccion:'En construcción', construir:'Por construir'};
function promoVigente(){
  var pr = CONFIG.promo;
  if (!pr || !pr.activa || !pr.url) return false;
  if (!pr.visibleHasta) return true;
  var lim = new Date(pr.visibleHasta).getTime();
  return isNaN(lim) ? true : Date.now() <= lim;
}

function renderResultado(){
  var R = calcular(), v = veredicto(R.L, R.P), ys = [0,-12,-18,-12,0];
  var rarc = '<ul class="rarc" aria-label="Estado de las cinco piezas">' + R.piezas.map(function(x,i){
    return '<li style="'+estiloPieza(x.p.id)+';--y:'+ys[i]+'px">'+anillo(x.p.id, x.pct, x.p.icono)+'<span class="lbl">'+x.p.corto+'</span><span class="lv">'+NIVEL[x.nivel]+'</span></li>';
  }).join('') + '</ul>';

  var prio = R.top.length
    ? '<ol class="prio">' + R.top.map(function(n){ return '<li style="'+estiloPieza(n.pieza.id)+'"><span>'+n.texto+'<small>'+n.pieza.nombre+'</small></span></li>'; }).join('') + '</ol>'
    : '<p>No encontramos pendientes urgentes. Su siguiente paso: construir juntos el pacto digital y acompañar de cerca los primeros meses.</p>';

  var filas = R.piezas.map(function(x){
    var construir = x.pend.filter(function(n){return n.nivel==='construir';});
    var afinar = x.pend.filter(function(n){return n.nivel==='afinar';}).slice(0,2);
    var lista = construir.concat(afinar);
    var cuerpo = lista.length
      ? '<ul class="needs">' + lista.map(function(n){ return '<li><span class="tag '+n.nivel+'">'+(n.nivel==='construir'?'Por construir':'Para afinar')+'</span><span>'+n.texto+'</span></li>'; }).join('') + '</ul>'
        + '<p class="where">Lo trabajamos en Tecnofamilias: <strong>'+CONFIG.dondeLoVemos[x.p.id]+'</strong></p>'
      : '<p class="ok">Esta pieza ya la tienen. ¡Sigan así!</p>';
    return '<article class="row" style="'+estiloPieza(x.p.id)+'"><div class="row-head">'+anillo(x.p.id, x.pct, x.p.icono)+'<h3>'+x.p.nombre+'</h3><span class="lvl">'+NIVEL[x.nivel]+'</span></div>'+cuerpo+'</article>';
  }).join('');

  var linkNinos = CONFIG.urlCuestionarioNinos ? ' <a href="'+CONFIG.urlCuestionarioNinos+'" target="_top">Abrir el cuestionario para niños</a>.' : '';
  var linkJuego = CONFIG.urlJuegoCartas ? ' <a href="'+CONFIG.urlJuegoCartas+'" target="_top">Ver el juego de cartas</a>.' : '';
  var pasos = '<ol class="steps">' +
    '<li>Que su hijo/a responda su cuestionario, “Misión: mi primer celular”.'+linkNinos+'</li>' +
    '<li>Comparen sus resultados en un momento tranquilo: ¿en qué coinciden? ¿Qué los sorprendió?</li>' +
    '<li>Jueguen en familia el juego de cartas de Tecnofamilias: abre estas conversaciones de forma divertida.'+linkJuego+'</li>' +
    '<li>Vean juntos una de las películas de abajo y conversen al final.</li>' +
    '<li>Elijan por cuál pieza empezar y trabájenla en las clases de Tecnofamilias.</li>' +
  '</ol>';

  var pelis = '<ul class="pelis">' + PELIS.map(function(m){ return '<li><strong>'+m.t+' <span class="yr">('+m.a+')</span></strong>'+m.d+'</li>'; }).join('') + '</ul>' +
    '<p class="adultos"><strong>Para ustedes, los adultos:</strong> <em>El dilema de las redes sociales</em> (documental, 2020), para entender cómo se diseñan las apps para captar la atención. Recomendado para adultos y adolescentes.</p>' +
    '<p class="fine">Revisen la clasificación por edad y en qué plataforma está disponible cada película en su país.</p>';

  var promo = promoVigente()
    ? '<div class="promo no-print"><p>'+CONFIG.promo.texto+'</p><a class="btn" href="'+CONFIG.promo.url+'" target="_top">'+CONFIG.promo.boton+'</a></div>' : '';

  var share = CONFIG.compartirResultados
    ? '<div class="share no-print"><label><input type="checkbox" id="consiento"><span>Acepto compartir con Tecnofamilias estos resultados de forma anónima (sin nombres ni datos de contacto) para mejorar los contenidos.</span></label><button type="button" class="btn btn-ghost" id="compartir" disabled>Compartir resultados anónimos</button><p class="fine" id="share-msg" aria-live="polite"></p></div>' : '';

  app.innerHTML = cabecera(true) +
  '<section class="sheet result">' +
    '<div class="verdict">' +
      '<p class="eyebrow">Su veredicto Tecnofamilias</p>' + rarc +
      '<h1 id="titulo" tabindex="-1"><span aria-hidden="true">'+v.icono+' </span>'+v.titulo+'</h1>' +
      '<p class="lead">'+v.texto+'</p>' +
      '<p class="pill">'+R.L+' de 5 piezas listas</p>' +
    '</div>' +
    bloqueEdad() +
    '<div class="block"><h2>Sus prioridades para empezar</h2>'+prio+'</div>' + bloqueCorreo() +
    '<div class="block"><h2>Su mapa, pieza por pieza</h2><div class="rows">'+filas+'</div></div>' +
    '<div class="box box-recuerden"><h2>Recuerden</h2>' +
      '<p><strong>Decir “todavía no” no es un castigo:</strong> es un acto de amor y cuidado. Explíquenle el porqué y lo que necesitan para llegar.</p>' +
      '<p><strong>Cada familia tiene sus normas y acuerdos.</strong> No tienen que ser iguales a los de otras casas, y está bien que su hijo/a lo escuche de ustedes con calma.</p>' +
      '<p><strong>Amabilidad y firmeza al mismo tiempo:</strong> validar lo que siente (“entiendo que te moleste”) y sostener lo que acordaron.</p>' +
    '</div>' +
    '<div class="block"><h2>Ahora, en familia</h2>'+pasos+'</div>' +
    '<div class="block"><h2>Para ver juntos</h2>'+pelis+'</div>' +
    promo +
    '<div class="actions no-print">' +
      '<button type="button" class="btn" id="imprimir">Guardar o imprimir mi resultado</button>' +
      (CONFIG.urlClases ? '<a class="btn btn-ghost" href="'+CONFIG.urlClases+'" target="_top">'+CONFIG.textoBotonClases+'</a>' : '') +
      '<button type="button" class="btn btn-ghost" id="reiniciar">Volver a empezar</button>' +
    '</div>' +
    share +
    '<details class="fuentes"><summary>Fuentes de las recomendaciones</summary><ul>' +
      '<li>Comisión de expertos sobre el impacto de la exposición de los jóvenes a las pantallas. Informe “Enfants et écrans”, Presidencia de Francia, abril de 2024: no tener celular antes de los 11 años; de 11 a 13, sin internet; desde los 13, con internet pero sin redes sociales; desde los 15, solo redes sociales “éticas”.</li>' +
      '<li>Jonathan Haidt, <em>La generación ansiosa</em> (2024): teléfono básico hasta los 14 años y redes sociales desde los 16 (<a href="https://anxiousgeneration.com/about" target="_blank" rel="noopener">anxiousgeneration.com</a>).</li>' +
      '<li>Condiciones de uso de WhatsApp y de las principales redes sociales: edad mínima de 13 años.</li>' +
      '<li>Herramientas de control parental: <a href="https://support.apple.com/es-lamr/108806" target="_blank" rel="noopener">Tiempo en pantalla (soporte de Apple)</a> y <a href="https://families.google/familylink/" target="_blank" rel="noopener">Google Family Link</a>.</li>' +
      '<li>Enfoque de disciplina positiva (Jane Nelsen): amabilidad y firmeza al mismo tiempo, y consecuencias que reparan en lugar de castigos.</li>' +
    '</ul><p>Este cuestionario es orientativo y no reemplaza la asesoría de un profesional.</p></details>' +
  '</section>' + pie();

  var h = document.getElementById('titulo'); if (h) h.focus({preventScroll:true});
  anuncio.textContent = 'Resultado listo: ' + v.titulo + '.';
}

function compartir(){
  var R = calcular(), msg = document.getElementById('share-msg');
  if (!window.parent || window.parent === window){
    msg.textContent = 'Esta opción funciona cuando el cuestionario está dentro de la plataforma de Tecnofamilias.';
    return;
  }
  var piezas = {};
  R.piezas.forEach(function(x){ piezas[x.p.id] = Math.round(x.pct*100); });
  try{
    window.parent.postMessage({tipo:'tecnofamilias:resultado', cuestionario:'padres', version:1, edad:valor('edad'), sistema:valor('so'), piezas:piezas, piezasListas:R.L}, CONFIG.origenPlataforma || '*');
    msg.textContent = 'Listo. Gracias por ayudarnos a mejorar.';
    document.getElementById('compartir').disabled = true;
  }catch(e){ msg.textContent = 'No se pudo compartir en este momento.'; }
}

/* ===================== Correo opcional ===================== */
var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function plataformaLista(){
  var c = CONFIG.correo;
  return !!(c && c.enviarAPlataforma && CONFIG.origenPlataforma && CONFIG.origenPlataforma !== '*' && window.parent && window.parent !== window);
}
function correoActivo(){
  var c = CONFIG.correo;
  return !!(c && (c.destino || plataformaLista()) && c.urlPolitica && c.contacto);
}
function textoAutorizacion(){
  var c = CONFIG.correo;
  return 'Autorizo a '+c.responsable+' a guardar y usar mi nombre, mi correo y el resumen de este resultado para enviármelo y para analizar, de forma agregada, qué temas necesitan más las familias, según su Política de Tratamiento de Datos.';
}
function bloqueCorreo(){
  if (!correoActivo()) return '';
  var c = CONFIG.correo;
  var autoriza = textoAutorizacion().replace('Política de Tratamiento de Datos', '<a href="'+c.urlPolitica+'" target="_blank" rel="noopener">Política de Tratamiento de Datos</a>');
  return '<form class="lead-box no-print" id="form-correo" novalidate>' +
    '<h2>'+c.titulo+'</h2><p class="lead-txt">'+c.texto+'</p>' +
    '<div class="campos">' +
      '<div class="campo"><label for="f-nombre">Tu nombre (opcional)</label><input id="f-nombre" type="text" autocomplete="given-name" maxlength="40"></div>' +
      '<div class="campo"><label for="f-email">Tu correo</label><input id="f-email" type="email" autocomplete="email" inputmode="email" maxlength="120" required></div>' +
    '</div>' +
    '<div class="hp" aria-hidden="true"><label for="f-web">Deja este campo vacío</label><input id="f-web" type="text" tabindex="-1" autocomplete="off"></div>' +
    '<label class="check"><input type="checkbox" id="f-ok"><span>'+autoriza+'</span></label>' +
    '<label class="check"><input type="checkbox" id="f-mkt"><span>Opcional: también acepto recibir por correo invitaciones a charlas, masterclass y recursos de Tecnofamilias.</span></label>' +
    '<button type="submit" class="btn" id="f-enviar" disabled>Enviarme mi resultado</button>' +
    '<p class="fine" id="f-msg" aria-live="polite"></p>' +
    '<p class="legal">Responsable: '+c.responsable+' ('+c.contacto+(c.telefono ? ', '+c.telefono : '')+'). Puedes conocer, actualizar, rectificar o suprimir tus datos, y retirar esta autorización, escribiendo a <a href="mailto:'+c.contacto+'">'+c.contacto+'</a>. No pedimos ni enviamos el nombre ni la edad de tu hijo o hija.</p>' +
  '</form>';
}
function actualizarBotonCorreo(){
  var b = document.getElementById('f-enviar'); if (!b) return;
  var em = document.getElementById('f-email'), ok = document.getElementById('f-ok');
  b.disabled = !(em && ok && EMAIL_RE.test(em.value.trim()) && ok.checked);
}
function utm(nombre){
  try { return (new URLSearchParams(window.location.search).get(nombre) || '').slice(0,80); } catch(e){ return ''; }
}
function enviarCorreo(){
  var c = CONFIG.correo, msg = document.getElementById('f-msg'), btn = document.getElementById('f-enviar');
  var email = document.getElementById('f-email').value.trim();
  if (!EMAIL_RE.test(email) || !document.getElementById('f-ok').checked){
    msg.textContent = 'Escribe un correo válido y marca la autorización para continuar.'; return;
  }
  if (document.getElementById('f-web').value){ terminarCorreo(); return; }
  var R = calcular(), v = veredicto(R.L, R.P);
  var datos = {
    token: c.token || '',
    email: email,
    nombre: document.getElementById('f-nombre').value.trim().slice(0,40),
    consentimiento: 'si',
    marketing: document.getElementById('f-mkt').checked ? 'si' : 'no',
    texto_autorizacion: textoAutorizacion(),
    version_politica: c.versionPolitica || '',
    veredicto: v.id,
    piezas_listas: String(R.L),
    piezas: R.piezas.map(function(x){ return x.p.id+':'+Math.round(x.pct*100); }).join('|'),
    prioridades: R.top.map(function(n){ return n.id; }).join(','),
    utm_source: utm('utm_source'), utm_medium: utm('utm_medium'), utm_campaign: utm('utm_campaign'),
    origen: 'cuestionario-padres'
  };
  if (plataformaLista()){
    var copia = {}; Object.keys(datos).forEach(function(k){ if (k !== 'token') copia[k] = datos[k]; });
    try{ window.parent.postMessage({tipo:'tecnofamilias:correo', cuestionario:'padres', version:1, datos:copia}, CONFIG.origenPlataforma); }catch(e){}
  }
  if (!c.destino){ terminarCorreo(); return; }
  btn.disabled = true; msg.textContent = 'Enviando…';
  fetch(c.destino, {method:'POST', mode:'no-cors', body:new URLSearchParams(datos)})
    .then(function(){ terminarCorreo(); })
    .catch(function(){ btn.disabled = false; msg.textContent = 'No pudimos enviar tus datos. Revisa tu conexión e inténtalo de nuevo.'; });
}
function terminarCorreo(){
  var f = document.getElementById('form-correo'); if (!f) return;
  f.innerHTML = '<h2>¡Listo!</h2><p class="lead-txt" role="status">Enviamos tu solicitud. En unos minutos te debe llegar el correo; si no lo ves, revisa las carpetas de spam o promociones.</p>';
  setTimeout(avisarAltura, 50);
}

/* ===================== Eventos ===================== */
app.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('button') : null;
  if (!t) return;
  if (t.id === 'empezar'){ st.pantalla = 'pregunta'; st.idx = 0; render(); return; }
  if (t.classList.contains('opt')){ elegir(+t.getAttribute('data-i')); return; }
  if (t.id === 'seguir'){ siguiente(); return; }
  if (t.id === 'atras'){ atras(); return; }
  if (t.id === 'imprimir'){ window.print(); return; }
  if (t.id === 'reiniciar'){ st = {pantalla:'inicio', idx:0, r:{}, lock:false}; render(); return; }
  if (t.id === 'compartir'){ compartir(); return; }
});
app.addEventListener('change', function(e){
  if (e.target && e.target.id === 'consiento'){
    var b = document.getElementById('compartir'); if (b) b.disabled = !e.target.checked;
  }
  if (e.target && e.target.id === 'f-ok') actualizarBotonCorreo();
});
app.addEventListener('input', function(e){
  if (e.target && e.target.id === 'f-email') actualizarBotonCorreo();
});
app.addEventListener('submit', function(e){
  if (e.target && e.target.id === 'form-correo'){ e.preventDefault(); enviarCorreo(); }
});
document.addEventListener('keydown', function(e){
  if (st.pantalla !== 'pregunta' || e.altKey || e.ctrlKey || e.metaKey) return;
  var n = parseInt(e.key, 10), q = PREGUNTAS[st.idx];
  if (n >= 1 && n <= q.opciones.length){ e.preventDefault(); elegir(n-1); }
});
var tAltura = null;
function avisarAlturaPronto(){ clearTimeout(tAltura); tAltura = setTimeout(avisarAltura, 120); }
if ('ResizeObserver' in window){ new ResizeObserver(avisarAlturaPronto).observe(document.body); }
window.addEventListener('load', avisarAltura);

render();
})();
</script>
</body>
</html>
